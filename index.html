<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWGReturns has moved to swgreturns.com</title>
<meta http-equiv="refresh" content="4; url=https://swgreturns.com/">
<link rel="canonical" href="https://swgreturns.com/">
<link rel="icon" href="https://swgtalon.online/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070b;
    --text: #eef4ff;
    --muted: #9aaabc;
    --gold: #f2cb73;
    --blue: #5eb6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Rajdhani", "Segoe UI", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 520px;
  }
  .logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(94, 182, 255, 0.45));
    margin-bottom: 24px;
  }
  h1 {
    font-family: "Orbitron", sans-serif;
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 900;
    text-transform: uppercase;
    margin: 0 0 12px;
    color: #fff;
  }
  p {
    font-size: 18px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 28px;
  }
  a.btn {
    display: inline-block;
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--blue), #3a7ecf);
    color: #05070b;
    font-family: "Orbitron", sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(94, 182, 255, 0.25);
  }
  .note {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://swgtalon.online/assets/logo.png" alt="SWGReturns logo">
    <h1>We've Moved!</h1>
    <p>SWGReturns is now at <strong>swgreturns.com</strong>. Update your bookmarks &mdash; you'll be redirected automatically in a few seconds.</p>
    <a class="btn" href="https://swgreturns.com/">Go to swgreturns.com</a>
    <div class="note">Redirecting automatically&hellip;</div>
  </div>
  <script>window.location.replace("https://swgreturns.com/");</script>
</body>
</html>
